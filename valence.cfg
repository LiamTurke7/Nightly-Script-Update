// Valence Stealth Engine v2 — AutoConfig Loader
// This runs in the Firefox parent/chrome process.
// It loads a frame script into every content tab, which injects
// the bypass code at DOMWindowCreated (before any page scripts).

try {
  dump(">>> Valence Stealth Engine v2 initializing...\n");

  // ── Step 1: Locate the bypass script file ──
  var appDir = Services.dirsvc.get("GreD", Ci.nsIFile);
  var stealthFile = appDir.clone();
  stealthFile.append("valence-stealth.js");

  dump(">>> Looking for: " + stealthFile.path + "\n");

  if (!stealthFile.exists()) {
    dump(">>> ERROR: valence-stealth.js not found!\n");
    throw new Error("valence-stealth.js not found");
  }

  // ── Step 2: Read the bypass script ──
  var bypassCode;
  try {
    var fileURI = Services.io.newFileURI(stealthFile);
    bypassCode = Cu.readUTF8URI(fileURI);
    dump(">>> Read via Cu.readUTF8URI: " + bypassCode.length + " bytes\n");
  } catch(readErr) {
    dump(">>> Cu.readUTF8URI failed: " + readErr + ", trying XPCOM fallback...\n");
    var fstream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    fstream.init(stealthFile, -1, 0, 0);
    var sstream = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
    sstream.init(fstream);
    bypassCode = sstream.read(sstream.available());
    sstream.close();
    fstream.close();
    dump(">>> Read via XPCOM: " + bypassCode.length + " bytes\n");
  }

  // ── Step 3: Build the frame script ──
  // Frame scripts run inside each content process/tab.
  // DOMWindowCreated fires before any page scripts, for all documents
  // including iframes. Cu.Sandbox with wantXrays:false lets us modify
  // the page's actual JS prototypes directly, bypassing CSP.

  var escapedBypassCode = JSON.stringify(bypassCode);

  var frameScriptCode = [
    'addEventListener("DOMWindowCreated", function(e) {',
    '  try {',
    '    var w = e.target.defaultView;',
    '    if (!w) return;',
    '    var uri = "";',
    '    try { uri = w.document.documentURI || ""; } catch(x) {}',
    '    if (/^(about|chrome|resource|moz-extension):/.test(uri)) return;',
    '    if (/^https?:\\/\\/([a-z0-9-]+\\.)*(google\\.[a-z.]+|bing\\.com|duckduckgo\\.com|search\\.yahoo\\.com)/i.test(uri)) return;',
    '    var sb = Cu.Sandbox(w, {',
    '      sandboxPrototype: w,',
    '      wantXrays: false',
    '    });',
    '    Cu.evalInSandbox(' + escapedBypassCode + ', sb);',
    '  } catch(ex) {',
    '    dump(">>> Valence inject error: " + ex + "\\n");',
    '  }',
    '}, true);'
  ].join('\n');

  // ── Step 4: Load the frame script via message manager ──
  // Try multiple methods to get the global message manager
  var mm = null;

  // Method 1: Services.mm
  try { mm = Services.mm; } catch(e1) {
    dump(">>> Services.mm not available: " + e1 + "\n");
  }

  // Method 2: XPCOM contract
  if (!mm) {
    try {
      mm = Cc["@mozilla.org/globalmessagemanager;1"].getService(Ci.nsIMessageListenerManager);
    } catch(e2) {
      dump(">>> nsIMessageListenerManager not available: " + e2 + "\n");
    }
  }

  // Method 3: Just getService()
  if (!mm) {
    try {
      mm = Cc["@mozilla.org/globalmessagemanager;1"].getService();
    } catch(e3) {
      dump(">>> getService() not available: " + e3 + "\n");
    }
  }

  if (!mm) {
    throw new Error("Could not obtain global message manager");
  }

  if (typeof mm.loadFrameScript !== 'function') {
    dump(">>> mm object found but loadFrameScript is not a function. Type: " + typeof mm.loadFrameScript + "\n");
    dump(">>> mm keys: " + Object.keys(mm).join(", ") + "\n");
    throw new Error("loadFrameScript not available on message manager");
  }

  // allowDelayedLoad = true: inject into all current AND future tabs
  mm.loadFrameScript("data:," + encodeURIComponent(frameScriptCode), true);

  dump(">>> Valence Stealth Engine v2 loaded successfully!\n");
  dump(">>> Frame script registered for all content tabs.\n");

  // ── Step 5: Dynamic User-Agent routing + SEB Compatibility Engine ──
  // Search engines (Google, Bing, DuckDuckGo) receive native Firefox UA.
  // All other websites receive modern stable Chrome 133 UA.
  // SEB-locked portals receive both cryptographic handshake headers.
  try {
    var httpHandler = Cc["@mozilla.org/network/protocol;1?name=http"].getService(Ci.nsIHttpProtocolHandler);
    var defaultFirefoxUA = httpHandler.userAgent;
    var TARGET_CHROME_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.6943.142 Safari/537.36";

    // ═══════════════════════════════════════════════════════════════
    // SEB Compatibility Engine
    // Supports two modes:
    //   1. "direct" — raw hex keys provided in seb-config.json
    //   2. "seb-file" — parse a .seb plist file to compute Config Key
    // ═══════════════════════════════════════════════════════════════

    // Pure JS SHA-256 implementation (independent of XPCOM / DOM environments)
    function sebSHA256(asciiStr) {
      var ascii = unescape(encodeURIComponent(asciiStr));
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);
      var lengthProperty = "length";
      var i, j;
      var result = "";
      var words = [];
      var asciiBitLength = ascii[lengthProperty] * 8;
      var hash = [];
      var k = [];
      var primeCounter = 0;
      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += "\x80";
      while ((ascii[lengthProperty] % 64) - 56) ascii += "\x00";
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
      words[words[lengthProperty]] = asciiBitLength | 0;
      for (j = 0; j < words[lengthProperty]; ) {
        var w = words.slice(j, (j += 16));
        var oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15],
            w2 = w[i - 2];
          var a = hash[0],
            e = hash[4];
          var temp1 =
            hash[7] +
            (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ (~e & hash[6])) +
            k[i] +
            ((w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] +
                    (rightRotate(w15, 7) ^
                      rightRotate(w15, 18) ^
                      (w15 >>> 3)) +
                    w[i - 7] +
                    (rightRotate(w2, 17) ^
                      rightRotate(w2, 19) ^
                      (w2 >>> 10))) |
                  0) | 0);
          var temp2 =
            (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? 0 : "") + b.toString(16);
        }
      }
      return result;
    }

    // Read a file to string using XPCOM
    function readFileToString(nsIFileObj) {
      var fstream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
      fstream.init(nsIFileObj, -1, 0, 0);
      var sstream = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
      sstream.init(fstream);
      var content = sstream.read(sstream.available());
      sstream.close();
      fstream.close();
      return content;
    }

    // ── Plist XML Parser ──
    // Parses Apple plist XML into a JS object (handles dict, array, string,
    // integer, real, true, false, data, date).
    function parsePlistXML(xmlStr) {
      var domParser = Cc["@mozilla.org/xmlextras/domparser;1"].createInstance(Ci.nsIDOMParser);
      var doc = domParser.parseFromString(xmlStr, "text/xml");
      
      function parseNode(node) {
        if (!node) return null;
        var tag = node.nodeName;
        switch (tag) {
          case "dict": {
            var obj = {};
            var children = [];
            for (var c = node.firstChild; c; c = c.nextSibling) {
              if (c.nodeType === 1) children.push(c); // ELEMENT_NODE
            }
            for (var i = 0; i < children.length; i += 2) {
              if (children[i].nodeName === "key" && children[i + 1]) {
                obj[children[i].textContent] = parseNode(children[i + 1]);
              }
            }
            return obj;
          }
          case "array": {
            var arr = [];
            for (var c = node.firstChild; c; c = c.nextSibling) {
              if (c.nodeType === 1) arr.push(parseNode(c));
            }
            return arr;
          }
          case "string": return node.textContent;
          case "integer": return parseInt(node.textContent, 10);
          case "real": return parseFloat(node.textContent);
          case "true": return true;
          case "false": return false;
          case "data": return node.textContent.trim();
          case "date": return node.textContent;
          default: return node.textContent;
        }
      }
      
      var plistEl = doc.documentElement; // <plist>
      for (var c = plistEl.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 1) return parseNode(c);
      }
      return null;
    }

    // ── Config Key computation from plist settings ──
    // Algorithm: remove originatorVersion, sort keys alphabetically,
    // serialize to compact JSON, then SHA256 the result.
    function computeConfigKeyFromSettings(settings) {
      if (!settings || typeof settings !== "object") return "";
      // Clone and remove non-essential keys
      var cleaned = {};
      for (var k in settings) {
        if (settings.hasOwnProperty(k) && k !== "originatorVersion") {
          cleaned[k] = settings[k];
        }
      }
      // Sort keys alphabetically
      var sortedKeys = Object.keys(cleaned).sort();
      // Build a sorted object for JSON serialization
      var sorted = {};
      for (var i = 0; i < sortedKeys.length; i++) {
        sorted[sortedKeys[i]] = cleaned[sortedKeys[i]];
      }
      // Compact JSON (no whitespace)
      var jsonStr = JSON.stringify(sorted);
      // SHA256 hash
      return sebSHA256(jsonStr);
    }

    // ── Load SEB configuration ──
    var SEB_CONFIG_KEY = "";
    var SEB_BROWSER_EXAM_KEY = "";
    var SEB_ENABLED = false;

    try {
      var sebConfigFile = appDir.clone();
      sebConfigFile.append("seb-config.json");

      if (sebConfigFile.exists()) {
        var sebConfigStr = readFileToString(sebConfigFile);
        var sebConfig = JSON.parse(sebConfigStr);
        dump(">>> SEB config loaded: mode=" + sebConfig.mode + "\n");

        if (sebConfig.mode === "direct") {
          // Direct mode: use raw hex keys from config
          SEB_CONFIG_KEY = sebConfig.configKey || "";
          SEB_BROWSER_EXAM_KEY = sebConfig.browserExamKey || "";
          SEB_ENABLED = (SEB_CONFIG_KEY.length > 0);
          dump(">>> SEB direct mode: configKey=" + SEB_CONFIG_KEY.substring(0, 8) + "..., browserExamKey=" + SEB_BROWSER_EXAM_KEY.substring(0, 8) + "...\n");

        } else if (sebConfig.mode === "seb-file") {
          // .seb file mode: parse plist and compute Config Key
          var sebFilePath = sebConfig.sebFilePath || "";
          var sebPlistFile = null;

          if (sebFilePath) {
            sebPlistFile = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
            sebPlistFile.initWithPath(sebFilePath);
          }

          if (sebPlistFile && sebPlistFile.exists()) {
            var plistStr = readFileToString(sebPlistFile);
            var settings = parsePlistXML(plistStr);
            if (settings) {
              SEB_CONFIG_KEY = computeConfigKeyFromSettings(settings);
              dump(">>> SEB Config Key computed from .seb file: " + SEB_CONFIG_KEY.substring(0, 16) + "...\n");
            }
          } else {
            dump(">>> SEB .seb file not found at: " + sebFilePath + "\n");
          }

          // BEK must always be provided directly (can't derive from binary)
          SEB_BROWSER_EXAM_KEY = sebConfig.browserExamKey || "";
          SEB_ENABLED = (SEB_CONFIG_KEY.length > 0);
        }
      } else {
        dump(">>> No seb-config.json found — SEB headers disabled.\n");
      }
    } catch(sebLoadErr) {
      dump(">>> SEB config load error: " + sebLoadErr + "\n");
    }

    if (SEB_ENABLED) {
      dump(">>> SEB Compatibility Engine ACTIVE — will inject cryptographic headers.\n");
    }

    var uaObserver = {
      observe: function(subject, topic, data) {
        if (topic === "http-on-modify-request") {
          try {
            var channel = subject.QueryInterface(Ci.nsIHttpChannel);
            var host = channel.URI ? channel.URI.asciiHost : "";

            // Dynamic User-Agent routing
            if (/(^|\.)(google\.[a-z.]+|bing\.com|duckduckgo\.com|search\.yahoo\.com)$/i.test(host)) {
              channel.setRequestHeader("User-Agent", defaultFirefoxUA, false);
            } else {
              var targetUA = SEB_ENABLED ? (TARGET_CHROME_UA + " SEB/3.3.2") : TARGET_CHROME_UA;
              channel.setRequestHeader("User-Agent", targetUA, false);
            }

            // SEB cryptographic header injection
            if (SEB_ENABLED) {
              try {
                var fullURL = channel.URI.spec;

                // X-SafeExamBrowser-ConfigKeyHash = SHA256(url + configKey)
                if (SEB_CONFIG_KEY) {
                  var configKeyHash = sebSHA256(fullURL + SEB_CONFIG_KEY);
                  channel.setRequestHeader("X-SafeExamBrowser-ConfigKeyHash", configKeyHash, false);
                }

                // X-SafeExamBrowser-RequestHash = SHA256(url + browserExamKey)
                if (SEB_BROWSER_EXAM_KEY) {
                  var requestHash = sebSHA256(fullURL + SEB_BROWSER_EXAM_KEY);
                  channel.setRequestHeader("X-SafeExamBrowser-RequestHash", requestHash, false);
                }
              } catch(sebErr) {
                dump(">>> SEB header injection error: " + sebErr + "\n");
              }
            }

          } catch(chanErr) {}
        }
      }
    };
    Services.obs.addObserver(uaObserver, "http-on-modify-request", false);
    dump(">>> Valence dynamic UA routing" + (SEB_ENABLED ? " + SEB header injection" : "") + " registered successfully.\n");
  } catch(uaErr) {
    dump(">>> Valence dynamic UA routing notice: " + uaErr + "\n");
  }

} catch(ex) {
  dump(">>> Valence Stealth Engine v2 FATAL ERROR: " + ex + "\n");
  if (ex.stack) dump(">>> Stack: " + ex.stack + "\n");
}
